<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --cream:#faf7f0; --ink:#1c1917; --muted:#57534e; --accent:#9a3412; --line:#e7e1d6; }
      html, body { width: 1280px; height: 640px; }
      body { background: var(--cream); font-family: "Space Grotesk", sans-serif; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
      .mark { width: 38px; height: 38px; border-radius: 10px; background: var(--ink); position: relative; }
      .mark::after { content: ""; position: absolute; inset: 11px 11px auto auto; width: 12px; height: 12px; border-radius: 4px; background: var(--accent); }
      .brand b { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
      h1 { font-family: "Newsreader", serif; font-weight: 500; font-size: 72px; line-height: 1.03; letter-spacing: -0.02em; }
      h1 em { font-style: italic; color: var(--accent); }
      .sub { margin-top: 22px; font-size: 23px; color: var(--muted); }
      .chips { margin-top: 40px; display: flex; align-items: center; gap: 22px; }
      .chip { display: flex; align-items: baseline; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 26px; box-shadow: 0 20px 50px -30px rgba(28,25,23,0.3); }
      .chip .k { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      .chip .v { font-family: "Newsreader", serif; font-size: 40px; line-height: 1; }
      .chip.before .v { color: #b91c1c; }
      .chip.after .v { color: var(--ink); }
      .arrow { font-size: 34px; color: var(--accent); font-weight: 700; }
      .foot { margin-top: 40px; font-family: ui-monospace, Menlo, monospace; font-size: 17px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; }
      .foot .p { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="brand"><span class="mark"></span><b>PixelJury</b></div>
    <h1>Make your AI-built site<br />stop looking <em>AI-built</em>.</h1>
    <div class="sub">Score the design, find the slop, and prove the glow-up.</div>
    <div class="chips">
      <div class="chip before"><span class="k">Before</span><span class="v">16</span></div>
      <span class="arrow">&rarr;</span>
      <div class="chip after"><span class="k">After</span><span class="v">84</span></div>
    </div>
    <div class="foot"><span class="p">$</span> npx pixeljury review</div>
  </body>
</html>
